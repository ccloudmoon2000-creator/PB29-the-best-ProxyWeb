```html
<!-- language: HTML, file: index.html, target: GitHub Pages -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Proxy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #0b0d10;
      color: #fff;
    }

    header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: #11151a;
      border-bottom: 1px solid #252a31;
    }

    header strong {
      font-size: 18px;
    }

    main {
      width: 100%;
      padding: 16px;
    }

    #proxy-form {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 12px;
    }

    #url {
      flex: 1;
      min-width: 0;
      height: 46px;
      padding: 0 14px;
      border: 1px solid #303740;
      border-radius: 8px;
      outline: none;
      background: #15191f;
      color: #fff;
      font-size: 15px;
    }

    #url:focus {
      border-color: #4d7cff;
    }

    button {
      height: 46px;
      padding: 0 22px;
      border: 0;
      border-radius: 8px;
      background: #3975ff;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #2e66e8;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      min-height: 22px;
      margin-bottom: 10px;
      color: #aab2bd;
      font-size: 13px;
    }

    #browser {
      width: 100%;
      min-height: calc(100vh - 145px);
      overflow: auto;
      border: 1px solid #252a31;
      border-radius: 8px;
      background: #fff;
      color: #111;
    }

    #browser iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 145px);
      min-height: 650px;
      border: 0;
      background: #fff;
    }

    @media (max-width: 650px) {
      #proxy-form {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <strong>Web Proxy</strong>
  </header>

  <main>
    <form id="proxy-form">
      <input
        id="url"
        type="text"
        placeholder="https://example.com"
        autocomplete="off"
        spellcheck="false"
      >

      <button id="go" type="submit">
        Abrir
      </button>
    </form>

    <div id="status"></div>

    <div id="browser">
      <iframe
        id="page"
        sandbox="allow-forms allow-modals allow-popups allow-presentation allow-same-origin allow-scripts"
      ></iframe>
    </div>
  </main>

  <script src="./index.js"></script>
</body>
</html>
