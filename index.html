<!-- language: HTML, file: index.html, target: GitHub Pages -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Proxy</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0d10;
      color: #f2f4f7;
    }

    header {
      padding: 18px 24px;
      border-bottom: 1px solid #252a31;
      background: #111419;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    main {
      width: min(1400px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px 15px;
      border: 1px solid #303640;
      border-radius: 8px;
      outline: none;
      background: #15191f;
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      border-color: #5b8cff;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 0 20px;
      background: #3975ff;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #2f68eb;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .status {
      min-height: 24px;
      margin-bottom: 10px;
      color: #aeb6c2;
      font-size: 13px;
    }

    .viewer {
      width: 100%;
      min-height: calc(100vh - 150px);
      border: 1px solid #252a31;
      border-radius: 10px;
      overflow: hidden;
      background: white;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 150px);
      min-height: 600px;
      border: 0;
      background: white;
    }
  </style>
</head>

<body>
  <header>
    <h1>Web Proxy</h1>
  </header>

  <main>
    <form id="proxy-form" class="toolbar">
      <input
        id="url"
        type="url"
        placeholder="https://example.com"
        autocomplete="off"
        required
      >
      <button id="go" type="submit">Abrir</button>
    </form>

    <div id="status" class="status"></div>

    <section class="viewer">
      <iframe
        id="viewer"
        title="Proxy viewer"
        sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts"
      ></iframe>
    </section>
  </main>

  <script src="./index.js"></script>
</body>
</html>
